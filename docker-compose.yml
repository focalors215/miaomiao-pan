services:
  pan:
    build: .
    image: ${PAN_IMAGE:-pan:latest}
    container_name: ${PAN_CONTAINER:-pan}
    restart: unless-stopped
    ports:
      - "${PAN_PORT:-8080}:8080"
    environment:
      # 首次启动时用来创建管理员账号；之后可以在网页右上角修改，修改后以网页设置为准
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      # 忘记密码时设为 true 并重启，会用上面的账号密码重置；重置后改回 false
      ADMIN_RESET: ${ADMIN_RESET:-false}
    volumes:
      - ./data:/data
      # 挂载宿主机目录作为“本机存储”，在网页里添加本机存储时根目录填 /mnt/disk
      # - /srv/files:/mnt/disk

  # 内嵌 OpenList：在它的管理界面（默认 5244 端口）里配置阿里云盘、百度网盘、OneDrive 等 70+ 种存储，
  # 然后在本站“添加存储”里选 OpenList 即可挂载。不需要时可以删掉这一段。
  openlist:
    image: ${OPENLIST_IMAGE:-openlistteam/openlist:latest}
    container_name: ${OPENLIST_CONTAINER:-openlist}
    restart: unless-stopped
    # 新版 OpenList 默认用非 root 用户运行，写不了 ./data；和 pan 容器一样用 root
    user: "0:0"
    ports:
      # 管理界面只绑定本机，需要远程访问请自行加反向代理
      - "127.0.0.1:${OPENLIST_PORT:-5244}:5244"
    environment:
      # OpenList 管理员账号 admin 的初始密码，默认和本站管理员密码相同；首次启动时生效
      OPENLIST_ADMIN_PASSWORD: ${OPENLIST_ADMIN_PASSWORD:-${ADMIN_PASSWORD}}
      UMASK: "022"
    volumes:
      - ./data/openlist:/opt/openlist/data
