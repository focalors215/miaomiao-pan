<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF6EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161B" media="(prefers-color-scheme: dark)">
  <title>喵喵零和小鱼的仓库</title>
  <link rel="icon" href="img/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 图标和吉祥物：内联 SVG 符号，用 <use href="#..."> 引用 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <!-- 界面图标：线条风格，统一 24×24、2px 描边 -->
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-storage" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6l2 2h7.4A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 10.5v6M9 13.5h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M15.5 5.5 18.5 8.5M4 20l1-4.2L16 4.8a1.8 1.8 0 0 1 2.6 0l.6.6a1.8 1.8 0 0 1 0 2.6L8.2 19z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5.2c0-.7.5-1.2 1.2-1.2h2.6c.7 0 1.2.5 1.2 1.2V7m3 0-.7 11.3a1.8 1.8 0 0 1-1.8 1.7H9a1.8 1.8 0 0 1-1.8-1.7L6.5 7m3.7 4v5m3.6-5v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4" fill="currentColor"/><path d="M4.5 20c.8-3.6 3.7-5.5 7.5-5.5s6.7 1.9 7.5 5.5" fill="currentColor"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.8v2.4m0 13.6v2.4M2.8 12h2.4m13.6 0h2.4M5.5 5.5l1.7 1.7m9.6 9.6 1.7 1.7m0-13-1.7 1.7m-9.6 9.6-1.7 1.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H14M10 12h10m0 0-3.5-3.5M20 12l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5.5 6.5 6.5L9 18.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M10 6c.6-.1 1.3-.2 2-.2 6 0 9.5 6.4 9.5 6.4s-1 1.9-3 3.7M6.6 7.6C4 9.3 2.5 12.2 2.5 12.2S6 18.5 12 18.5c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11m0-11-11 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16 5.5V5a1.5 1.5 0 0 0-1.5-1.5h-9A1.5 1.5 0 0 0 4 5v9a1.5 1.5 0 0 0 1.5 1.5h.5" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="m8 10 4-4 4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M13.5 4.5H19.5V10.5M19.5 4.5 11 13M10 6H6.5A1.5 1.5 0 0 0 5 7.5v10A1.5 1.5 0 0 0 6.5 19h10a1.5 1.5 0 0 0 1.5-1.5V14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- ===================== 登录 ===================== -->
  <section id="login" class="login" hidden>
    <div class="login-art" aria-hidden="true">
      <img class="hero-sticker float" src="img/sticker.webp" width="900" height="830" alt="">
    </div>
    <form id="login-form" class="login-card" novalidate>
      <h1 class="brand-title"><span class="b-cat">喵喵零</span><span class="b-and">和</span><span class="b-fish">小鱼</span><br>的仓库</h1>
      <label class="field">
        <span class="sr-only">用户名</span>
        <svg class="field-icon"><use href="#i-user"/></svg>
        <input name="username" autocomplete="username" placeholder="用户名" required>
      </label>
      <label class="field">
        <span class="sr-only">密码</span>
        <svg class="field-icon"><use href="#i-lock"/></svg>
        <input name="password" type="password" autocomplete="current-password" placeholder="密码" required>
        <button type="button" class="eye" aria-label="显示密码"><svg><use href="#i-eye-off"/></svg></button>
      </label>
      <button class="btn primary large" type="submit">登 录</button>
      <div class="login-foot">
        <label class="checkbox"><input type="checkbox" name="remember" checked><span></span>记住我</label>
        <button type="button" class="link" id="forgot">忘记密码？</button>
      </div>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <!-- ===================== 主界面 ===================== -->
  <section id="app" class="app" hidden>
    <header class="topbar glass">
      <a class="brand" href="#/" aria-label="喵喵零和小鱼的仓库，回到全部文件">
        <img class="brand-mark" src="img/mascot-sm.webp" width="200" height="161" alt="">
        <span class="brand-text"><span class="b-cat">喵喵零</span>和<span class="b-fish">小鱼</span>的仓库</span>
      </a>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <span class="sr-only">搜索当前文件夹</span>
        <input id="search" type="search" placeholder="搜索当前文件夹…" autocomplete="off">
      </label>
      <div class="account">
        <button id="account-btn" class="account-btn" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar"><svg><use href="#i-user"/></svg></span>
          <span id="account-name" class="account-name"></span>
          <svg class="chev"><use href="#i-down"/></svg>
        </button>
        <div id="account-menu" class="menu" role="menu" hidden>
          <button role="menuitem" id="menu-settings"><svg><use href="#i-gear"/></svg>账号设置</button>
          <button role="menuitem" id="menu-logout"><svg><use href="#i-logout"/></svg>退出登录</button>
        </div>
      </div>
    </header>

    <nav class="sidebar glass" aria-label="主导航">
      <button class="nav-item" data-view="files"><svg><use href="#i-folder"/></svg><span>全部文件</span></button>
      <button class="nav-item" data-view="storages"><svg><use href="#i-storage"/></svg><span>存储挂载</span></button>
      <div class="sidebar-art" aria-hidden="true"><img src="img/mascot.webp" width="640" height="514" alt=""></div>
    </nav>

    <div class="stage">
      <!-- 文件 -->
      <main id="view-files" class="view" hidden>
        <div class="toolbar">
          <nav id="crumbs" class="crumbs" aria-label="当前位置"></nav>
          <div class="actions">
            <button id="btn-refresh" class="btn" title="刷新"><svg><use href="#i-refresh"/></svg><span>刷新</span></button>
            <button id="btn-mkdir" class="btn"><svg><use href="#i-folder-plus"/></svg><span>新建文件夹</span></button>
            <label class="btn primary"><svg><use href="#i-upload"/></svg><span>上传文件</span><input id="upload-input" type="file" multiple hidden></label>
          </div>
        </div>
        <div id="drop" class="card table-card">
          <table class="table files">
            <thead>
              <tr>
                <th class="col-check"><label class="checkbox"><input type="checkbox" id="check-all" aria-label="全选"><span></span></label></th>
                <th class="col-name"><button class="sort" data-sort="name">文件名<svg><use href="#i-sort"/></svg></button></th>
                <th class="col-size"><button class="sort" data-sort="size">大小<svg><use href="#i-sort"/></svg></button></th>
                <th class="col-time"><button class="sort" data-sort="modified">修改时间<svg><use href="#i-sort"/></svg></button></th>
                <th class="col-act">操作</th>
              </tr>
            </thead>
            <tbody id="file-rows"></tbody>
          </table>
          <div id="empty" class="empty" hidden>
            <div class="empty-art" aria-hidden="true"><img src="img/mascot.webp" width="640" height="514" alt="" loading="lazy"></div>
            <p class="empty-title">这里还空空的</p>
            <p class="empty-sub">把文件拖到这里，或者点“上传文件”</p>
          </div>
          <div class="drop-hint" aria-hidden="true"><svg><use href="#i-upload"/></svg>松开即可上传到当前文件夹</div>
        </div>
      </main>

      <!-- 存储 -->
      <main id="view-storages" class="view" hidden>
        <div class="page-head">
          <div>
            <h1 class="page-title">存储挂载</h1>
            <p class="page-sub">把不同的存储空间挂载到同一个目录里，统一管理你的文件</p>
          </div>
          <button id="btn-add-storage" class="btn primary"><svg><use href="#i-plus"/></svg><span>添加存储</span></button>
        </div>
        <div class="card table-card">
          <table class="table storages">
            <thead><tr><th>名称</th><th>类型</th><th>挂载路径</th><th>状态</th><th>启用</th><th class="col-act">操作</th></tr></thead>
            <tbody id="storage-rows"></tbody>
          </table>
          <div id="storage-empty" class="empty" hidden>
            <div class="empty-art" aria-hidden="true"><img src="img/mascot.webp" width="640" height="514" alt="" loading="lazy"></div>
            <p class="empty-title">还没有挂载任何存储</p>
            <p class="empty-sub">添加本机目录、S3、WebDAV 或 123云盘，就能在这里统一浏览</p>
          </div>
        </div>
      </main>
    </div>

    <!-- 多选操作条 -->
    <div id="selection-bar" class="selection-bar glass" hidden>
      <span id="selection-count"></span>
      <button id="sel-clear" class="btn">取消选择</button>
      <button id="sel-delete" class="btn danger"><svg><use href="#i-trash"/></svg><span>删除</span></button>
    </div>

    <!-- 上传进度 -->
    <section id="uploads" class="uploads glass" aria-live="polite" hidden>
      <header><strong>上传</strong><span id="uploads-summary"></span></header>
      <div id="upload-list"></div>
    </section>
  </section>

  <!-- 添加/编辑存储：右侧滑出面板（手机上从底部升起） -->
  <dialog id="storage-dialog" class="drawer" aria-labelledby="storage-title">
    <form id="storage-form" class="drawer-body" novalidate>
      <header class="sheet-head">
        <h2 id="storage-title">添加存储</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="sheet-scroll">
        <label class="stack">存储类型
          <span class="select-wrap"><select name="type" id="storage-type" autofocus></select><svg><use href="#i-down"/></svg></span>
        </label>
        <label class="stack">挂载路径<input name="mountPath" placeholder="/我的存储" required></label>
        <div id="storage-fields"></div>
        <div class="switch-row">
          <span>启用此存储</span>
          <label class="switch"><input type="checkbox" name="enabled" checked><span></span><b class="sr-only">启用此存储</b></label>
        </div>
        <p class="error" id="storage-error" role="alert"></p>
      </div>
      <footer class="sheet-foot">
        <button type="button" class="btn" data-close>取消</button>
        <button class="btn primary" type="submit">保存</button>
      </footer>
    </form>
  </dialog>

  <!-- 账号设置 -->
  <dialog id="account-dialog" class="modal" aria-labelledby="account-title">
    <form id="account-form" class="modal-body" novalidate>
      <header class="sheet-head">
        <h2 id="account-title"><span class="title-icon"><svg><use href="#i-gear"/></svg></span>账号设置</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="form-grid">
        <label for="acc-username">用户名</label>
        <input id="acc-username" name="username" autocomplete="username" required maxlength="32">
        <label for="acc-current">当前密码</label>
        <span class="pw"><input id="acc-current" name="currentPassword" type="password" autofocus autocomplete="current-password" placeholder="请输入当前密码" required><button type="button" class="eye" aria-label="显示密码"><svg><use href="#i-eye-off"/></svg></button></span>
        <label for="acc-new">新密码</label>
        <span class="pw"><input id="acc-new" name="newPassword" type="password" autocomplete="new-password" placeholder="留空表示不修改" maxlength="128"><button type="button" class="eye" aria-label="显示密码"><svg><use href="#i-eye-off"/></svg></button></span>
        <label for="acc-confirm">确认新密码</label>
        <span class="pw"><input id="acc-confirm" name="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入新密码"><button type="button" class="eye" aria-label="显示密码"><svg><use href="#i-eye-off"/></svg></button></span>
      </div>
      <p class="help">新密码至少 8 位。保存后，其他设备上的登录会全部退出。</p>
      <p class="error" id="account-error" role="alert"></p>
      <footer class="sheet-foot">
        <button type="button" class="btn" data-close>取消</button>
        <button class="btn primary" type="submit">保存</button>
      </footer>
    </form>
  </dialog>

  <!-- 通用确认/输入对话框（替代浏览器原生 prompt/confirm） -->
  <dialog id="ask" class="modal small" aria-labelledby="ask-title">
    <form id="ask-form" class="modal-body" novalidate>
      <h2 id="ask-title"></h2>
      <p id="ask-message" class="ask-message"></p>
      <input id="ask-input" class="ask-input" autocomplete="off" autofocus>
      <p class="error" id="ask-error" role="alert"></p>
      <footer class="sheet-foot">
        <button type="button" class="btn" data-close>取消</button>
        <button id="ask-ok" class="btn primary" type="submit">确定</button>
      </footer>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- 预览 -->
  <dialog id="preview" class="preview">
    <header class="pv-bar">
      <strong id="pv-name" class="pv-name"></strong>
      <span id="pv-status" class="pv-status"></span>
      <span id="pv-count" class="pv-count"></span>
      <a id="pv-open" class="pv-btn" target="_blank" rel="noopener" title="新标签打开"><svg><use href="#i-external"/></svg><span>新标签打开</span></a>
      <a id="pv-download" class="pv-btn" title="下载"><svg><use href="#i-download"/></svg><span>下载</span></a>
      <button id="pv-close" class="pv-btn" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    </header>
    <div id="pv-body" class="pv-body" tabindex="-1" autofocus></div>
    <button id="pv-prev" class="pv-nav prev" aria-label="上一个"><svg><use href="#i-chevron"/></svg></button>
    <button id="pv-next" class="pv-nav next" aria-label="下一个"><svg><use href="#i-chevron"/></svg></button>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
